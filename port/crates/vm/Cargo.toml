[package]
name = "marlang-vm"
version.workspace = true
edition.workspace = true

[dependencies]
marlang-core = { path = "../core" }
libloading = { version = "0.8", optional = true }
libffi = { version = "5", optional = true }
cranelift-codegen = { version = "0.129", optional = true }
cranelift-frontend = { version = "0.129", optional = true }
cranelift-jit = { version = "0.129", optional = true }
cranelift-module = { version = "0.129", optional = true }
cranelift-native = { version = "0.129", optional = true }
target-lexicon = { version = "0.13", optional = true }
rustc-hash = "2"
crossbeam-deque = "0.8"
crossbeam-channel = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "time", "io-util", "net", "sync", "macros"] }
hyper = { version = "1", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
http-body-util = "0.1"
bytes = "1"
tokio-tungstenite = "0.26"
futures-util = "0.3"
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "ring"] }
rustls-pki-types = "1"
rustls-native-certs = "0.8"

[dev-dependencies]
criterion = { workspace = true }
marlang-types = { path = "../types" }
tungstenite = "0.26"

[features]
default = ["ffi", "jit"]
ffi = ["libloading", "libffi"]
jit = ["cranelift-codegen", "cranelift-frontend", "cranelift-jit", "cranelift-module", "cranelift-native", "target-lexicon"]

[[bench]]
name = "vm_benchmark"
harness = false
