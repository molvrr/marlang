[package]
name = "marlang-vm"
version.workspace = true
edition.workspace = true

[dependencies]
marlang-core = { path = "../core" }
libloading = { version = "0.8", optional = true }
libffi = { version = "5", optional = true }
rustc-hash = "2"
crossbeam-deque = "0.8"
crossbeam-channel = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "time", "io-util", "net", "sync", "macros"] }

[dev-dependencies]
criterion = { workspace = true }
marlang-types = { path = "../types" }

[features]
default = ["ffi"]
ffi = ["libloading", "libffi"]

[[bench]]
name = "vm_benchmark"
harness = false
