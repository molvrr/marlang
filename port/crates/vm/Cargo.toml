[package]
name = "marlang-vm"
version.workspace = true
edition.workspace = true

[dependencies]
marlang-core = { path = "../core" }
libloading = { version = "0.8", optional = true }
rustc-hash = "2"

[dev-dependencies]
criterion = { workspace = true }
marlang-types = { path = "../types" }

[features]
default = ["ffi"]
ffi = ["libloading"]

[[bench]]
name = "vm_benchmark"
harness = false
